name: Android Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Android release tag to create
        required: true
        type: string
      vnt_tag:
        description: Preferred vnt-dev/vnt tag; falls back to the latest release
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref_name || inputs.release_tag }}
  cancel-in-progress: false

env:
  VNT_REPOSITORY: vnt-dev/vnt

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      app_tag: ${{ steps.metadata.outputs.app_tag }}
      vnt_tag: ${{ steps.metadata.outputs.vnt_tag }}
      version_name: ${{ steps.metadata.outputs.version_name }}
      version_code: ${{ steps.metadata.outputs.version_code }}
    steps:
      - id: metadata
        name: Validate tags and versions
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_VNT_TAG: ${{ inputs.vnt_tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            app_tag="$GITHUB_REF_NAME"
          else
            app_tag="$INPUT_RELEASE_TAG"
          fi
          requested_vnt_tag="${INPUT_VNT_TAG:-$app_tag}"
          for value in "$app_tag" "$requested_vnt_tag"; do
            [[ "$value" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || {
              echo "Invalid release tag: $value" >&2
              exit 2
            }
          done
          if gh release view "$requested_vnt_tag" --repo "$VNT_REPOSITORY" >/dev/null 2>&1; then
            vnt_tag="$requested_vnt_tag"
          else
            echo "VNT release $requested_vnt_tag was not found; using the latest release"
            vnt_tag="$(gh release view --repo "$VNT_REPOSITORY" --json tagName --jq .tagName)"
            [[ -n "$vnt_tag" ]] || {
              echo "No VNT release is available" >&2
              exit 3
            }
          fi
          version_name="${app_tag#v}"
          {
            echo "app_tag=$app_tag"
            echo "vnt_tag=$vnt_tag"
            echo "version_name=$version_name"
            echo "version_code=$GITHUB_RUN_NUMBER"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build APK (${{ matrix.variant }})
    needs: metadata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: arm64-v8a
            abis: arm64-v8a
          - variant: armeabi-v7a
            abis: armeabi-v7a
          - variant: x86_64
            abis: x86_64
          - variant: universal
            abis: arm64-v8a armeabi-v7a x86_64
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Download and verify vnt-jni
        env:
          GH_TOKEN: ${{ github.token }}
          ABIS: ${{ matrix.abis }}
          VNT_TAG: ${{ needs.metadata.outputs.vnt_tag }}
        run: |
          set -euo pipefail
          rm -rf app/src/main/jniLibs
          mkdir -p native
          for abi in $ABIS; do
            asset="vnt-jni-${abi}-${VNT_TAG}.so"
            mkdir -p "app/src/main/jniLibs/$abi"
            for attempt in {1..12}; do
              rm -f "native/$asset" "native/$asset.sha256"
              if gh release download "$VNT_TAG" \
                --repo "$VNT_REPOSITORY" \
                --pattern "$asset" \
                --pattern "$asset.sha256" \
                --dir native; then
                break
              fi
              if [[ "$attempt" == 12 ]]; then
                echo "VNT release asset $asset was not available after 12 attempts" >&2
                exit 2
              fi
              echo "VNT release asset $asset is not ready; retrying in 30 seconds"
              sleep 30
            done
            (cd native && sha256sum -c "$asset.sha256")
            install -m 755 "native/$asset" "app/src/main/jniLibs/$abi/libvnt_jni.so"
          done

      - name: Build unsigned release APK
        env:
          VARIANT: ${{ matrix.variant }}
          VERSION_NAME: ${{ needs.metadata.outputs.version_name }}
          VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
          VNT_TAG: ${{ needs.metadata.outputs.vnt_tag }}
        run: |
          set -euo pipefail
          gradle_args=(
            --no-daemon
            clean
            lintDebug
            testDebugUnitTest
            assembleRelease
            -PvntVersionName="$VERSION_NAME"
            -PvntVersionCode="$VERSION_CODE"
            -PvntCoreTag="$VNT_TAG"
          )
          if [[ "$VARIANT" != "universal" ]]; then
            gradle_args+=(-PvntAbi="$VARIANT")
          fi
          ./gradlew "${gradle_args[@]}"

      - name: Sign and verify APK
        env:
          VARIANT: ${{ matrix.variant }}
          ABIS: ${{ matrix.abis }}
          APP_TAG: ${{ needs.metadata.outputs.app_tag }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          # Gradle 未配置签名时产物可能是 unsigned
          if [[ ! -f "$apk" ]]; then
            apk="$(find app/build/outputs/apk/release -name '*.apk' -not -name '*.aligned.apk' | head -1)"
          fi
          echo "Input APK: $apk"
          mkdir -p release-assets
          output="release-assets/VNT-Android-${APP_TAG}-${VARIANT}.apk"
          build_tools="$ANDROID_SDK_ROOT/build-tools/36.0.0"

          # 检查 secrets 是否齐全
          missing=0
          for required in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [[ -z "${!required:-}" ]] && missing=1 || true
          done

          if [[ $missing -eq 1 ]]; then
            echo "⚠️  GitHub secrets 未配置，生成临时 debug keystore 签名"
            KEYSTORE=/tmp/vnt-debug.keystore
            keytool -genkey -v -keystore "$KEYSTORE" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              >/dev/null 2>&1
            "$build_tools/zipalign" -f -P 16 4 "$apk" "${apk}.aligned"
            "$build_tools/apksigner" sign \
              --ks "$KEYSTORE" --ks-pass pass:android --key-pass pass:android \
              --out "$output" "${apk}.aligned"
            rm -f "${apk}.aligned" "$KEYSTORE"
          else
            echo "🔐  使用 GitHub secrets 执行正式签名"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
            "$build_tools/zipalign" -f -P 16 4 "$apk" "${apk}.aligned"
            "$build_tools/apksigner" sign \
              --ks release.keystore \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --out "$output" "${apk}.aligned"
            rm -f "${apk}.aligned" release.keystore
          fi

          # 验证签名
          "$build_tools/apksigner" verify --verbose "$output"
          echo "✅ APK 签名验证通过：$output"
          (cd release-assets && sha256sum "$(basename "$output")" > "$(basename "$output").sha256")

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: VNT-Android-${{ matrix.variant }}
          path: release-assets/VNT-Android-${{ needs.metadata.outputs.app_tag }}-${{ matrix.variant }}.apk*
          if-no-files-found: error

  publish:
    name: Publish Android release:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download signed APKs
        uses: actions/download-artifact@v4
        with:
          pattern: VNT-Android-*
          path: release-assets
          merge-multiple: true

      # 用成熟的 action-gh-release，替代 gh CLI（它偶尔会 "成功" 但实际上没创建 release）
      - name: Create release and upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.app_tag }}
          name: VNT Android ${{ needs.metadata.outputs.app_tag }}
          body: |
            Built with VNT Rust core [${{ needs.metadata.outputs.vnt_tag }}](https://github.com/${{ vars.VNT_REPOSITORY }}/releases/tag/${{ needs.metadata.outputs.vnt_tag }}).
            Includes a universal APK plus arm64-v8a, armeabi-v7a, and x86_64 APKs.
          files: |
            release-assets/*.apk
            release-assets/*.sha256
          fail_on_unmatched_files: true
